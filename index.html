<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>7.a Tunniplaan</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root { --bg: #f4f4f5; --card: #ffffff; --text: #18181b; --accent: #2563eb; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 16px; }
        h1 { font-size: 1.5rem; text-align: center; color: var(--text); }
        #schedule-container { max-width: 600px; margin: 0 auto; }
        
        .day-card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .day-title { font-weight: bold; font-size: 1.2rem; margin-bottom: 12px; border-bottom: 2px solid var(--bg); padding-bottom: 8px; color: var(--accent); }
        
        .lesson { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--bg); }
        .lesson:last-child { border-bottom: none; padding-bottom: 0; }
        
        .lesson-time { font-weight: 600; font-size: 0.9rem; color: #52525b; min-width: 45px; display: flex; align-items: center; }
        .lesson-details { display: flex; flex-direction: column; justify-content: center; }
        
        .subject { font-weight: bold; font-size: 1.05rem; }
        .meta { font-size: 0.85rem; color: #71717a; margin-top: 2px; }
        
        .error-box { color: #b91c1c; padding: 12px; background: #fee2e2; border-radius: 8px; font-size: 0.9rem; }
    </style>
</head>
<body>
    <h1>7.a Tunniplaan</h1>
    <div id="schedule-container">Laen andmeid...</div>

    <script>
        // The exact source file on the school's server
        const targetUrl = 'https://tamme.tartu.ee/tunniplaan/cl_7a.html';

        // Multi-proxy fallback to bypass Tartu municipal CORS blocks
        const proxies = [
            url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
            url => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
            url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`
        ];

        async function fetchWithFallback(url) {
            let lastError;
            for (const proxyGen of proxies) {
                try {
                    const proxyUrl = proxyGen(url);
                    const res = await fetch(proxyUrl);
                    if (!res.ok) throw new Error(`HTTP status ${res.status}`);
                    
                    if (proxyUrl.includes('allorigins')) {
                        const json = await res.json();
                        if (json.contents) return json.contents;
                    } else {
                        const text = await res.text();
                        if (text && text.trim().length > 0) return text;
                    }
                } catch (err) {
                    lastError = err;
                    console.warn(`Proxy failed: ${proxyGen(url)}`, err);
                }
            }
            throw new Error(`Kõik proxy'd ebaõnnestusid. Viimane viga: ${lastError?.message}`);
        }

        async function fetchAndParse() {
            const container = document.getElementById('schedule-container');
            try {
                const rawHtml = await fetchWithFallback(targetUrl);
                
                // Parse the raw HTML text into a readable DOM tree
                const parser = new DOMParser();
                const doc = parser.parseFromString(rawHtml, 'text/html');
                
                // Find the main schedule table (aSc usually generates one large table)
                const tables = Array.from(doc.querySelectorAll('table'));
                const scheduleTable = tables.find(t => t.querySelectorAll('tr').length > 2) || tables[0];

                if (!scheduleTable) {
                    throw new Error("Ei leidnud lehelt tunniplaani tabelit.");
                }

                const rows = Array.from(scheduleTable.querySelectorAll('tr'));
                let scheduleData = [];

                // Extract times (horizontal axis)
                const headerCells = Array.from(rows[0].querySelectorAll('td, th')).map(c => c.innerText.trim());

                // Loop through days (vertical axis)
                for (let i = 1; i < rows.length; i++) {
                    const cells = Array.from(rows[i].querySelectorAll('td, th'));
                    if (cells.length < 2) continue; // Skip malformed/spacer rows

                    const rowLabel = cells[0].innerText.trim();
                    let lessons = [];

                    for (let j = 1; j < cells.length; j++) {
                        const rawContent = cells[j].innerText.trim();
                        // Ignore empty slots or aSc's non-breaking space artifacts
                        if (rawContent && rawContent !== '&nbsp;') {
                            lessons.push({
                                time: headerCells[j] || `${j}. tund`,
                                content: rawContent
                            });
                        }
                    }

                    if (lessons.length > 0) {
                        scheduleData.push({ day: rowLabel, lessons });
                    }
                }

                if (scheduleData.length === 0) {
                    throw new Error("Tabel leiti, aga see tundub olevat tühi.");
                }

                renderSchedule(scheduleData);
            } catch (error) {
                container.innerHTML = `<div class="error-box">
                    <strong>Viga andmete laadimisel:</strong><br>${error.message}
                </div>`;
                console.error(error);
            }
        }

        function renderSchedule(scheduleData) {
            const container = document.getElementById('schedule-container');
            container.innerHTML = '';

            scheduleData.forEach(day => {
                const card = document.createElement('div');
                card.className = 'day-card';
                
                let lessonsHtml = day.lessons.map(l => {
                    // Split aSc's multiline cell into Subject and Room/Teacher
                    const parts = l.content.split('\n').filter(p => p.trim() !== '');
                    const subject = parts[0] || '';
                    const details = parts.slice(1).join(' • ');

                    return `
                        <div class="lesson">
                            <div class="lesson-time">${l.time}</div>
                            <div class="lesson-details">
                                <span class="subject">${subject}</span>
                                ${details ? `<span class="meta">${details}</span>` : ''}
                            </div>
                        </div>
                    `;
                }).join('');

                card.innerHTML = `<div class="day-title">${day.day}</div>${lessonsHtml}`;
                container.appendChild(card);
            });
        }

        // Initialize fetch
        fetchAndParse();

        // Register Service Worker for PWA installation capability
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => {
                console.warn("Service worker registration failed (normal for local dev):", err);
            });
        }
    </script>
</body>
</html>
