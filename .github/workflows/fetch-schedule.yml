name: Fetch Timetable

on:
  schedule:
    # Runs at 04:00 UTC (07:00 in Estonia) every Monday through Friday
    - cron: '0 4 * * 1-5'
  workflow_dispatch: # This allows you to click a button to run it manually right now

permissions:
  contents: write # Required so the bot can commit the new file

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Download schedule HTML
        run: |
          curl -sL "https://tamme.tartu.ee/tunniplaan/cl_7a.html" -o schedule.html
          
      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add schedule.html
          
          # This checks if the file actually changed before trying to commit, preventing empty commit errors
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update schedule [skip ci]" && git push)
